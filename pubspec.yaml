name: mood_tracker
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.14.0

dependencies:
    flutter:
        sdk: flutter
    material_ui: ^1.1.0

    cupertino_icons: ^1.0.8
    carousel_slider: ^5.1.2
    google_fonts: ^9.0.0
    flutter_svg: ^2.5.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/mood_excited.svg
        - assets/mood_happy.svg
        - assets/mood_calm.svg
        - assets/mood_angry.svg
        - assets/mood_sad.svg
        - assets/mood_anxious.svg
